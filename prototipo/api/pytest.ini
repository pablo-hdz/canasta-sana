[pytest]
testpaths = tests
filterwarnings =
    # Aviso interno de starlette.testclient con anyio 4.16; no es de este código.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    # starlette 1.10 recomienda httpx2 para su TestClient; solo afecta a las pruebas (no se instaló otro paquete).
    ignore:Using `httpx` with `starlette.testclient` is deprecated
